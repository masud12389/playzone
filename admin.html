<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayZone Admin</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1725;color:#fff;font-family:Arial,"Noto Sans Bengali",sans-serif}.top{padding:18px;background:#132a40;display:flex;justify-content:space-between}.brand{color:#ffd21a;font-weight:900;font-size:24px}.wrap{padding:16px;max-width:1000px;margin:auto}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#18324b;border-radius:14px;padding:16px}.num{font-size:28px;font-weight:900;color:#ffd21a}.panel{margin-top:14px}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #31506c;text-align:left}button{background:#ffd21a;border:0;border-radius:9px;padding:9px 12px;font-weight:700}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}table{font-size:13px}}</style></head>
<body><header class="top"><div class="brand">PLAYZONE ADMIN</div><div>⚙️</div></header>
<div class="wrap"><h1>Dashboard</h1><div class="cards"><div class="card">Users<div class="num">1,248</div></div><div class="card">Games<div class="num">12</div></div><div class="card">Tournaments<div class="num">18</div></div><div class="card">Ad Revenue<div class="num">৳ 48,500</div></div></div>
<div class="panel"><h2>Recent Users</h2><table><tr><th>User</th><th>Points</th><th>Status</th></tr><tr><td>Demo User</td><td>1,000</td><td>Active</td></tr><tr><td>Player 102</td><td>4,250</td><td>Active</td></tr><tr><td>Player 103</td><td>780</td><td>Review</td></tr></table></div>
<div class="panel"><h2>Admin Actions</h2><button onclick="alert('Game manager demo')">Game Manager</button> <button onclick="alert('Tournament manager demo')">Tournament Manager</button> <button onclick="alert('Sponsor manager demo')">Sponsor Manager</button></div>
</div></body></html>
